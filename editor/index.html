<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambar Portfolio — Quick Editor</title><style>body{margin:0;background:#0a0a0a;color:#eee;font:14px system-ui;padding:28px}.wrap{max-width:1000px;margin:auto}h1{font-size:42px;letter-spacing:-.05em}.note{color:#aaa;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:#191919;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}button.primary{background:#d9ff45;color:#080808;border:0}.item{display:flex;gap:12px;align-items:center;border:1px solid #2b2b2b;background:#111;padding:10px;margin:8px 0;border-radius:10px}.item img{width:80px;height:60px;object-fit:cover;border-radius:6px}.item input{flex:1;background:#090909;border:1px solid #333;color:#fff;padding:9px;border-radius:6px}.item[draggable=true]{cursor:grab}.small{color:#777;font-size:12px}</style></head><body><div class="wrap"><h1>Portfolio Quick Editor</h1><p class="note">This lightweight organizer lets you reorder, rename, hide and export portfolio items in your browser. It is a safe editing sandbox; the real live CMS is the <b>/admin/</b> dashboard once the GitHub + Decap setup is connected.</p><div class="toolbar"><button class="primary" id="save">Save locally</button><button id="export">Export order JSON</button><button id="reset">Reset</button><a href="../admin/" style="color:#d9ff45;padding:10px">Open CMS ↗</a></div><div id="list"></div></div><script>const key='ambar-portfolio-editor-v1';const items=[...['005','006','007','008','009','010','011','012','013','014','015','016','017','018','019','020','021','022','023','024','025','026','027','028','029','030','031','032','034','035','036','037','038','039','040','041','042','043','044','045','046','047','048','049','050','051','052','053','054','055'].map(n=>({cat:'graphics',n})),...['056','058','061','062','064','066','068','069','071','073','077','079','081','082','084','087','089','090','092','094','099','102','103'].map(n=>({cat:'3d',n})),...['104','105','106','107','108','109'].map(n=>({cat:'motion',n}))];let data=JSON.parse(localStorage.getItem(key)||'null')||items;const list=document.querySelector('#list');function render(){list.innerHTML='';data.forEach((x,i)=>{const el=document.createElement('div');el.className='item';el.draggable=true;el.dataset.i=i;el.innerHTML=`<img src="../assets/${x.cat}/${x.n}.webp"><input value="${x.cat.toUpperCase()} / ${x.n}"><button data-hide>${x.hidden?'Show':'Hide'}</button>`;el.querySelector('input').oninput=e=>x.label=e.target.value;el.querySelector('[data-hide]').onclick=()=>{x.hidden=!x.hidden;render()};el.ondragstart=e=>e.dataTransfer.setData('text/plain',i);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{const from=+e.dataTransfer.getData('text/plain'),to=+el.dataset.i;const [m]=data.splice(from,1);data.splice(to,0,m);render()};list.appendChild(el)})}render();document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(data));alert('Saved in this browser.')};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='portfolio-order.json';a.click()};document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);data=items;render()}</script></body></html>
